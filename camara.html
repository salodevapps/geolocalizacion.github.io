<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foto desde el navegador</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 24px auto; padding: 0 16px; }
    video, #resultado img { display: block; width: 100%; border-radius: 12px; }
    #resultado { margin-top: 16px; padding: 16px; background: #f0f3f8; border-radius: 12px; }
    #resultado img { height: auto; }
    button { margin: 8px 8px 8px 0; padding: 10px 14px; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Capturar foto</h1>

  <video id="video" autoplay playsinline muted hidden></video>
  <div>
    <button id="abrirCamara">Abrir cámara</button>
    <button id="tomarFoto" hidden>Tomar foto</button>
    <button id="descargar" hidden>Descargar imagen</button>
  </div>

  <div id="resultado">
    <h2>Mi captura</h2>
    <p>La foto y este texto se incluirán en la imagen descargada.</p>
    <img id="foto" alt="Foto tomada con la cámara" hidden>
  </div>

  <canvas id="canvas" hidden></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const video = document.querySelector("#video");
    const canvas = document.querySelector("#canvas");
    const foto = document.querySelector("#foto");
    const botonAbrir = document.querySelector("#abrirCamara");
    const botonTomar = document.querySelector("#tomarFoto");
    const botonDescargar = document.querySelector("#descargar");
    let stream;

    botonAbrir.addEventListener("click", async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" } }
        });

        video.srcObject = stream;
        video.hidden = false;
        botonTomar.hidden = false;
      } catch (error) {
        alert("No se pudo acceder a la cámara. Revisa los permisos del navegador.");
        console.error("Error de cámara:", error);
      }
    });

    botonTomar.addEventListener("click", () => {
      if (!video.videoWidth || !video.videoHeight) {
        alert("La cámara aún no está lista. Inténtalo de nuevo.");
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      foto.src = canvas.toDataURL("image/jpeg", 0.92);
      foto.hidden = false;
      botonDescargar.hidden = false;

      // Detiene la cámara después de tomar la foto.
      stream?.getTracks().forEach(track => track.stop());
      video.srcObject = null;
      video.hidden = true;
      botonTomar.hidden = true;
    });

    botonDescargar.addEventListener("click", async () => {
      try {
        const elemento = document.querySelector("#resultado");
        const imagenCanvas = await html2canvas(elemento, {
          backgroundColor: "#ffffff",
          scale: window.devicePixelRatio || 1
        });

        imagenCanvas.toBlob(blob => {
          if (!blob) {
            alert("No se pudo generar la imagen.");
            return;
          }

          const url = URL.createObjectURL(blob);
          const enlace = document.createElement("a");
          enlace.href = url;
          enlace.download = "mi-captura.png";
          enlace.click();
          URL.revokeObjectURL(url);
        }, "image/png");
      } catch (error) {
        console.error("Cámara:", error.name, error.message);

  const mensajes = {
    NotAllowedError: "Permite el acceso a la cámara en los permisos del sitio y vuelve a cargar la página.",
    NotFoundError: "No se encontró una cámara disponible.",
    NotReadableError: "La cámara está siendo usada por otra aplicación. Ciérrala e inténtalo otra vez.",
    OverconstrainedError: "No se pudo seleccionar la cámara solicitada. Prueba sin especificar la cámara trasera.",
    SecurityError: "La página no tiene un contexto seguro. Ábrela mediante HTTPS."
  };

  alert(mensajes[error.name] || `Error de cámara: ${error.name}. ${error.message}`);
      }
    });
  </script>
</body>
</html>
