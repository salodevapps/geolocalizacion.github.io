<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1463d9">
  <title>Geolocalización inversa</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px;
      color: #172033;
      background: #f2f5f9;
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 22px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 4px 20px #17203314;
    }

    h1 { margin-top: 0; font-size: 1.6rem; }
    h2 { margin-top: 24px; font-size: 1.15rem; }

    button, input {
      min-height: 46px;
      border-radius: 8px;
      font: inherit;
    }

    button {
      width: 100%;
      padding: 10px 14px;
      border: 0;
      color: white;
      background: #1463d9;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    input {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #aeb9c8;
    }

    label { display: block; margin: 10px 0 5px; font-weight: 600; }

    .coords {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    #mensaje {
      min-height: 1.5em;
      overflow-wrap: anywhere;
    }

    #resultados {
      padding: 14px;
      border-radius: 8px;
      background: #f2f5f9;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: .88rem;
    }

    .nota { color: #536176; font-size: .9rem; }

    @media (max-width: 440px) {
      main { padding: 17px; }
      .coords { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Geolocalización inversa</h1>
    <p>Obtén tus coordenadas o escribe unas para buscar su dirección aproximada.</p>

    <button id="buscarUbicacion" type="button">Usar mi ubicación</button>
    <p id="mensaje" role="status" aria-live="polite"></p>

    <form id="formulario">
      <div class="coords">
        <div>
          <label for="latitud">Latitud</label>
          <input id="latitud" type="number" step="any" min="-90" max="90"
                 placeholder="-16.4090" required>
        </div>
        <div>
          <label for="longitud">Longitud</label>
          <input id="longitud" type="number" step="any" min="-180" max="180"
                 placeholder="-71.5375" required>
        </div>
      </div>
      <p><button type="submit">Buscar dirección de estas coordenadas</button></p>
    </form>

    <h2>Datos recibidos</h2>
    <pre id="resultados">Aún no hay resultados.</pre>

    <p class="nota">
      La dirección puede ser aproximada y depende de los datos disponibles en
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">
        OpenStreetMap
      </a>.
    </p>
  </main>

  <script>
  globalThis.obtenerGeolocalizacion = async function () {
  if (!window.isSecureContext || !navigator.geolocation) {
    throw new Error("La geolocalización requiere HTTPS o localhost y un navegador compatible.");
  }

  const position = await new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject);
  });

  const { coords } = position;
  const url = new URL("https://nominatim.openstreetmap.org/reverse");
  url.search = new URLSearchParams({
    format: "jsonv2",
    lat: String(coords.latitude),
    lon: String(coords.longitude),
    "accept-language": "es"
  });

  const response = await fetch(url);
  if (!response.ok) throw new Error(`Error HTTP ${response.status}`);

  const data = await response.json();

  console.log(data);

  return {
    distrito: data.address?.city ?? null,
    provincia: data.address?.region ?? null,
    pais: data.address?.country ?? null,
    calle: data.address?.road ?? null,
    latitud: coords.latitude,
    longitud: coords.longitude,
    precisionMetros: coords.accuracy,
    datos: data
  };
};



obtenerGeolocalizacion()
  .then(resultado => {
    console.log(resultado.calle);

    alert(resultado.calle);
    alert(resultado.provincia);

    // console.log(resultado);
  })
  .catch(error => console.error("No se pudo obtener la ubicación:", error.message));
  </script>
</body>
</html>
