<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1463d9">
  <title>Geolocalización inversa</title>
  
</head>
<body>
 

  <script>
  globalThis.obtenerGeolocalizacion = async function () {
  if (!window.isSecureContext || !navigator.geolocation) {
    throw new Error("La geolocalización requiere HTTPS o localhost y un navegador compatible.");
  }

  const position = await new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject);
  });

  const { coords } = position;
  const url = new URL("https://nominatim.openstreetmap.org/reverse");
  url.search = new URLSearchParams({
    format: "jsonv2",
    lat: String(coords.latitude),
    lon: String(coords.longitude),
    "accept-language": "es"
  });

  const response = await fetch(url);
  if (!response.ok) throw new Error(`Error HTTP ${response.status}`);

  const data = await response.json();

  console.log(data);

  return {
    distrito: data.address?.city ?? null,
    provincia: data.address?.state ?? null,
    pais: data.address?.country ?? null,
    calle: data.address?.road ?? null,
    latitud: coords.latitude,
    longitud: coords.longitude,
    precisionMetros: coords.accuracy,
    datos: data
  };
};



obtenerGeolocalizacion()
  .then(resultado => {
    console.log(resultado.calle);

    alert(resultado.calle);
    alert(resultado.provincia);

    // console.log(resultado);
  })
  .catch(error => console.error("No se pudo obtener la ubicación:", error.message));
  </script>
</body>
</html>
